<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0E1218">
<meta name="description" content="Tradera — your private trading journal, setup watchlist and entry-price alerts.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tradera">
<link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Tradera — Journal &amp; Entry Alerts</title>
<script>
  /* Apply the saved theme before first paint so there is no flash. */
  (function () {
    try {
      var t = localStorage.getItem("tradera:theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (_) { /* storage blocked */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css?v=2.4.1">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1CB7A"/>
      <stop offset="1" stop-color="#C98F2E"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 64 64">
      <path d="M14 22h24M26 22v24" fill="none" stroke="url(#brass)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="47" cy="22" r="4.5" fill="#3BD69B"/>
    </symbol>
  </defs>
</svg>

<header class="mobilebar">
  <div class="mb-brand">
    <span class="brand-mark"><svg><use href="#mark"/></svg></span>
    <span id="mbTitle">Overview</span>
  </div>
  <div class="mb-actions">
    <button class="mb-feed" id="mobileFeed" type="button" data-view="alerts" aria-label="Price feed status" title="Price feed status">
      <span class="dot"></span>
      <span id="mobileFeedText">Live</span>
    </button>
    <button class="icon-btn mb-bell" type="button" data-action="enable-alerts" aria-label="Turn on browser alerts" title="Browser alerts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7M10.5 20a2 2 0 0 0 3 0"/></svg>
      <em class="nav-dot" id="mobileAlertDot" hidden></em>
    </button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#mark"/></svg></span>
      <div class="brand-text">
        <strong>Tradera</strong>
        <span>Plan it. Wait for it. Log it.</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Main">
      <button type="button" data-view="dashboard" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16M8 15l4-5 3 3 5-7"/></svg>
        <span>Overview</span><kbd>1</kbd>
      </button>
      <button type="button" data-view="journal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Zm0 14a2 2 0 0 1 2-2h12M9 8h6M9 12h6"/></svg>
        <span>Journal</span><kbd>2</kbd>
      </button>
      <button type="button" data-view="setups">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
        <span>Setups</span><kbd>3</kbd>
      </button>
      <button type="button" data-view="pairs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg>
        <span>Markets</span><kbd>4</kbd>
      </button>
      <button type="button" data-view="alerts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7M10.5 20a2 2 0 0 0 3 0"/></svg>
        <span>Alerts</span><em class="nav-dot" id="navAlertDot" hidden></em><kbd>5</kbd>
      </button>
      <button type="button" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.5-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.5 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>
        <span>Settings</span><kbd>6</kbd>
      </button>
    </nav>

    <div class="side-foot">
      <div class="sessions" id="sessions" aria-label="Market sessions"></div>
      <div class="feed-pill" id="feedPill" title="Price feed status">
        <span class="dot"></span>
        <span id="feedText">Connecting…</span>
      </div>
      <button class="notify-btn" id="notifyBtn" type="button">Turn on browser alerts</button>
      <div class="side-row">
        <span class="side-note"><span id="clock"></span></span>
        <button class="icon-btn" type="button" data-action="toggle-theme" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
      </div>
      <div class="shortcuts"><kbd>N</kbd> new trade <kbd>S</kbd> new setup</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-copy">
        <h1 id="viewTitle">Overview</h1>
        <p id="viewSub">Your book at a glance</p>
      </div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div class="view" id="view">
      <div class="skeleton">
        <div class="sk sk-hero"></div>
        <div class="sk sk-row"></div>
        <div class="sk sk-row"></div>
      </div>
    </div>
  </main>
</div>

<nav class="tabbar" aria-label="Mobile navigation">
  <button type="button" data-view="dashboard" class="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16M8 15l4-5 3 3 5-7"/></svg>
    <span>Overview</span>
  </button>
  <button type="button" data-view="journal">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Zm0 14a2 2 0 0 1 2-2h12M9 8h6M9 12h6"/></svg>
    <span>Journal</span>
  </button>
  <button type="button" data-view="setups">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
    <span>Setups</span>
  </button>
  <button type="button" data-view="pairs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg>
    <span>Markets</span>
  </button>
  <button type="button" data-view="alerts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7M10.5 20a2 2 0 0 0 3 0"/></svg>
    <span>Alerts</span>
  </button>
  <button type="button" data-view="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.5-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.5 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>
    <span>Settings</span>
  </button>
</nav>

<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm">
    <span class="brand-mark"><svg><use href="#mark"/></svg></span>
    <h1>Welcome back to Tradera</h1>
    <p id="gateText">Your journal is private. Enter your password to open it on this device.</p>
    <label class="field"><span id="gateLabel">Password</span>
      <input id="gateKey" type="password" inputmode="text" autocomplete="current-password" placeholder="Your password" required autofocus>
    </label>
    <button class="btn primary" type="submit">Log in</button>
    <div class="form-error" id="gateError" hidden></div>
    <p class="gate-note" id="gateNote">You'll stay logged in on this device for 30 days.</p>
  </form>
</div>

<dialog class="modal" id="modal">
  <div id="modalBody"></div>
</dialog>
<dialog class="modal confirm" id="confirmDialog">
  <form method="dialog" class="modal-inner">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="form-actions">
      <button class="btn" value="cancel" type="submit">Cancel</button>
      <button class="btn danger" value="ok" type="submit" id="confirmOk">Delete</button>
    </div>
  </form>
</dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/app.js?v=2.4.1"></script>
</body>
</html>
