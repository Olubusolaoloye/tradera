[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Refresh quotes, evaluate entry alerts and re-ring urgent notifications every
# minute (about 43,000 runs a month, inside Netlify's free allowance).
# Change to "*/2 * * * *" to halve usage.
[functions."poll"]
  schedule = "* * * * *"

# Send every /api request to one function so routes stay identical to the
# local Node server.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback (there is only one page, but keeps deep links working).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
